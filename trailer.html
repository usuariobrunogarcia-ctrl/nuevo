<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somari Deluxe — Tráiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* ============================================================
     SOMARI DELUXE — Tráiler animado (1920x1080, escalado a la ventana)
     Controles: Enter/clic = empezar · Espacio = pausa · ←/→ = escena
                F = pantalla completa · R = reiniciar
     URL: trailer.html?scene=N empieza en la escena N
          trailer.html?gp=8   segundos de cada fragmento de gameplay
     ============================================================ */
  :root {
    --gold: #ffd400; --gold2: #ff9d00; --red: #e8231a; --blue: #1f5bff;
    --cyan: #28e0ff; --pink: #ff2fb4; --green: #3bdc4a; --ink: #0b0620;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.playing { cursor: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000;
           transform-origin: center center; flex: none; font-family: 'Press Start 2P', monospace; color: #fff; }
  #bg, #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scene { position: absolute; inset: 0; }
  #scan { position: absolute; inset: 0; pointer-events: none;
          background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 2px, transparent 2px 5px); mix-blend-mode: multiply; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #wipe { position: absolute; inset: -10% -60%; pointer-events: none; transform: translateX(-120%) skewX(-20deg);
          background: repeating-linear-gradient(90deg, var(--gold) 0 90px, var(--red) 90px 180px, var(--blue) 180px 270px); }
  #stage.clean #scan, #stage.clean #vig { display: none; }
  #stage.paused * { animation-play-state: paused !important; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
           background: #000; color: #fff; font-family: 'Press Start 2P', monospace; text-align: center; z-index: 10; cursor: pointer; padding: 16px; }
  #start h1 { font-size: 28px; color: var(--gold); margin: 0; line-height: 1.5; }
  #start p { font-size: 11px; line-height: 2.2; opacity: .75; margin: 0; }
  #start .go { font-size: 16px; animation: blink 1s steps(2) infinite; }

  /* ---------- utilidades ---------- */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .abs { position: absolute; }
  .pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .outline { text-shadow: 0 6px 0 #000, 6px 0 0 #000, -6px 0 0 #000, 0 -6px 0 #000, 6px 6px 0 #000, -6px 6px 0 #000, 6px -6px 0 #000, -6px -6px 0 #000, 0 14px 0 rgba(0,0,0,.45); }
  .outline-s { text-shadow: 0 4px 0 #000, 4px 0 0 #000, -4px 0 0 #000, 0 -4px 0 #000, 4px 4px 0 #000, -4px 4px 0 #000, 4px -4px 0 #000, -4px -4px 0 #000; }
  .big { font-size: 120px; line-height: 1.15; }
  .mid { font-size: 64px; line-height: 1.3; }
  .sm  { font-size: 30px; line-height: 1.8; }
  .xs  { font-size: 22px; line-height: 1.8; }
  .gold { color: var(--gold); } .red { color: var(--red); } .blue { color: #4d86ff; } .cyan { color: var(--cyan); } .green { color: var(--green); } .pink { color: var(--pink); }

  .glitch { position: relative; display: inline-block; }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; text-shadow: none; }
  .glitch::before { color: var(--cyan); animation: gl1 .9s steps(1) infinite; mix-blend-mode: screen; }
  .glitch::after  { color: var(--pink); animation: gl2 .7s steps(1) infinite; mix-blend-mode: screen; }

  .tag { display: inline-block; padding: 18px 28px; background: var(--red); color: #fff; transform: skewX(-12deg); box-shadow: 10px 10px 0 #000; }
  .tag > span { display: inline-block; transform: skewX(12deg); }
  .panel { position: absolute; border: 8px solid #fff; box-shadow: 0 0 0 8px #000, 16px 16px 0 8px rgba(0,0,0,.6); overflow: hidden; }

  /* ---------- logo ---------- */
  .logo { position: relative; display: inline-flex; flex-direction: column; align-items: center; }
  .logo .somari { font-size: 190px; letter-spacing: 6px; color: var(--gold); line-height: 1;
    text-shadow: 0 4px 0 #ffb000, 0 8px 0 #ff8a00, 0 12px 0 #f06400, 0 16px 0 #d84500, 0 20px 0 #b02a00, 0 24px 0 #7a1500,
      0 30px 0 #000, 8px 30px 0 #000, -8px 30px 0 #000, 8px 0 0 #000, -8px 0 0 #000, 0 -8px 0 #000, 8px -8px 0 #000, -8px -8px 0 #000, 0 50px 40px rgba(0,0,0,.6); }
  .logo .deluxe { margin-top: 26px; font-size: 64px; padding: 22px 60px 18px; background: linear-gradient(180deg, #ff3b30, #b3000e);
    border: 6px solid #fff; box-shadow: 0 0 0 6px #000, 12px 12px 0 6px rgba(0,0,0,.5); transform: skewX(-14deg) rotate(-3deg); letter-spacing: 10px; }
  .logo .deluxe span { display: inline-block; transform: skewX(14deg); text-shadow: 5px 5px 0 #000; }
  .shine { position: absolute; inset: -20px; overflow: hidden; pointer-events: none; mix-blend-mode: overlay; }
  .shine::after { content: ''; position: absolute; top: -50%; bottom: -50%; width: 180px; left: -300px; transform: rotate(20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent); animation: shine 2.4s ease-in-out 1s infinite; }

  /* ---------- tarjeta de gameplay ---------- */
  .gp { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
  .gp .lbl { font-size: 26px; color: var(--gold); letter-spacing: 6px; display: flex; align-items: center; gap: 20px; }
  .gp .lbl i { width: 22px; height: 22px; background: var(--red); border-radius: 50%; animation: blink 1s steps(2) infinite; }
  .gp .what { font-size: 58px; line-height: 1.5; max-width: 1600px; text-align: center; }
  .gp .bar { width: 520px; height: 8px; background: #222; }
  .gp .bar b { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); transform-origin: left; }

  /* ---------- keyframes ---------- */
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes popIn { 0% { transform: scale(0) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.18) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  @keyframes stamp { 0% { transform: scale(3.2) rotate(-10deg); opacity: 0; } 70% { transform: scale(.94) rotate(-3deg); opacity: 1; } 100% { transform: scale(1) rotate(-3deg); opacity: 1; } }
  @keyframes slideL { from { transform: translateX(-1400px); } }
  @keyframes slideR { from { transform: translateX(1400px); } }
  @keyframes slideU { from { transform: translateY(700px); opacity: 0; } }
  @keyframes slideD { from { transform: translateY(-700px); opacity: 0; } }
  @keyframes zoomOut { from { transform: scale(6); opacity: 0; } }
  @keyframes zoomAway { to { transform: scale(4); opacity: 0; } }
  @keyframes drop { 0% { transform: translateY(-900px); } 70% { transform: translateY(30px); } 85% { transform: translateY(-12px); } 100% { transform: translateY(0); } }
  @keyframes floaty { 50% { transform: translateY(-24px); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wordIn { from { transform: translateY(80px) scale(.6); opacity: 0; filter: blur(12px); } }
  @keyframes shine { 0% { left: -300px; } 60%, 100% { left: 110%; } }
  @keyframes gl1 { 0% { clip-path: inset(0 0 70% 0); transform: translate(-10px, 0); } 20% { clip-path: inset(40% 0 30% 0); transform: translate(12px, 0); }
                   40% { clip-path: inset(80% 0 0 0); transform: translate(-6px, 0); } 60% { clip-path: inset(10% 0 60% 0); transform: translate(8px, 0); }
                   80% { clip-path: inset(55% 0 20% 0); transform: translate(-12px, 0); } 100% { clip-path: inset(0 0 100% 0); } }
  @keyframes gl2 { 0% { clip-path: inset(60% 0 10% 0); transform: translate(10px, 0); } 25% { clip-path: inset(0 0 80% 0); transform: translate(-8px, 0); }
                   50% { clip-path: inset(30% 0 45% 0); transform: translate(12px, 0); } 75% { clip-path: inset(75% 0 5% 0); transform: translate(-10px, 0); } 100% { clip-path: inset(0 0 100% 0); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 10% { transform: translate(-22px, 12px); } 20% { transform: translate(18px,-16px); } 30% { transform: translate(-14px,-8px); }
                     40% { transform: translate(14px, 14px); } 50% { transform: translate(-8px, 6px); } 60% { transform: translate(8px,-6px); } 80% { transform: translate(-4px, 2px); } }
  @keyframes crtOn { 0% { transform: scale(1, .004); filter: brightness(8); } 40% { transform: scale(1, .004); filter: brightness(8); } 70% { transform: scale(1, 1.05); filter: brightness(2); } 100% { transform: scale(1,1); filter: none; } }
  @keyframes drawX { from { transform: scale(0) rotate(-90deg); } }
  #scene.shake { animation: shake .45s linear; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="bg" width="1920" height="1080"></canvas>
    <div id="scene"></div>
    <canvas id="fx" width="1920" height="1080"></canvas>
    <div id="scan"></div>
    <div id="vig"></div>
    <div id="wipe"></div>
    <div id="flash"></div>
  </div>
</div>
<div id="start">
  <h1>SOMARI DELUXE<br>TRÁILER</h1>
  <p>F: pantalla completa · Espacio: pausa · ← →: cambiar escena · R: reiniciar<br>
     Las pantallas negras de GAMEPLAY son el hueco para insertar tus clips al editar.</p>
  <div class="go">▶ CLIC O ENTER PARA EMPEZAR</div>
</div>

<script src="js/tailsgfx.js"></script>
<script>
'use strict';
// =============================================================
//  CONFIGURACIÓN
// =============================================================
var params = new URLSearchParams(location.search);
var GAMEPLAY_SEGUNDOS = +params.get('gp') || 6;   // duración de cada pantalla negra de gameplay

// =============================================================
//  SPRITES (pixel art)
// =============================================================
var NES = { R: '#d82800', S: '#fcb87c', B: '#7c3c00', O: '#2044ec', Y: '#fce000', W: '#ffffff', K: '#101010', G: '#3bdc4a', P: '#ff7ab0', D: '#8a0010' };

// Somari: gorra roja, bigote, peto azul y zapatillas rojas de Sonic.
var SOMARI = [
  [ '....RRRRR.....',
    '...RRRRRRRRR..',
    '...BBBSSKS....',
    '..BSBSSSKSSS..',
    '..BSBBSSSKSSS.',
    '..BBSSSSKKKK..',
    '....SSSSSSS...',
    '...RROORRR....',
    '..RRROORROORR.',
    '.RRRROOOOORRRR',
    '.SSROYOOYORSS.',
    '.SSSOOOOOOSSS.',
    '.SSOOOOOOOOSS.',
    '...OOO..OOO...',
    '..RRRR..RRRR..',
    '.RRWRR..RRWRR.' ],
  [ '....RRRRR.....',
    '...RRRRRRRRR..',
    '...BBBSSKS....',
    '..BSBSSSKSSS..',
    '..BSBBSSSKSSS.',
    '..BBSSSSKKKK..',
    '....SSSSSSS...',
    '..SRRROORR....',
    '.SSRRROOROORS.',
    '.SSRRROOOOORS.',
    '...ROYOOYOO...',
    '...OOOOOOOO...',
    '..OOOOOOOOOO..',
    '.OOO.....OOO..',
    'RRRR.....RRRR.',
    'RWRR......RWRR' ],
  [ '....RRRRR.....',
    '...RRRRRRRRR..',
    '...BBBSSKS....',
    '..BSBSSSKSSS..',
    '..BSBBSSSKSSS.',
    '..BBSSSSKKKK..',
    '....SSSSSSS...',
    '...RROORRRSS..',
    '..RRROORROSSS.',
    '..RRROOOOORR..',
    '..SSOYOOYO....',
    '..SSOOOOOO....',
    '....OOOOO.....',
    '....OOOO......',
    '...RRRRR......',
    '...RWRRRR.....' ]
];
// Enemigo genérico (mariquita robot)
var BUG = [
  [ '....RRRRR....',
    '..RRWRRRRRR..',
    '.RRWWRRKRRRR.',
    '.RRRRRRRRKRRK',
    'RRKRRRRRRRRRK',
    'RRRRRKRRRRRRK',
    '.KKKKKKKKKKK.',
    '..KWK...KWK..',
    '...K.....K...' ],
  [ '....RRRRR....',
    '..RRWRRRRRR..',
    '.RRWWRRKRRRR.',
    '.RRRRRRRRKRRK',
    'RRKRRRRRRRRRK',
    'RRRRRKRRRRRRK',
    '.KKKKKKKKKKK.',
    '.KWK.....KWK.',
    '..K.......K..' ]
];

function pixCanvas(rows, pal) {
  var h = rows.length, w = rows[0].length, c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var ch = rows[y][x];
    if (ch === '.' || !pal[ch]) continue;
    g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1);
  }
  return c;
}
var TG = window.SM && SM.TailsGfx;
var TAILS_ANIM = { idle: [0, 1, 2, 3, 4, 5], walk: [11, 12, 13, 14, 15, 16, 17, 18], run: [19, 20], fly: [37, 38], roll: [51, 52, 53, 54] };
function tailsCanvas(i) {
  var f = TG.frames[i], w = f[0], h = f[1], s = f[2], c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  for (var k = 0; k < s.length; k++) {
    if (s[k] === '.') continue;
    g.fillStyle = TG.pal[s.charCodeAt(k) - 97]; g.fillRect(k % w, (k / w) | 0, 1, 1);
  }
  return c;
}
var FR = {
  somari: SOMARI.map(function (r) { return pixCanvas(r, NES); }),
  bug: BUG.map(function (r) { return pixCanvas(r, NES); }),
  tails: {}
};
if (TG) for (var k in TAILS_ANIM) FR.tails[k] = TAILS_ANIM[k].map(tailsCanvas);

// Sprite animado dentro del DOM
var anims = [];
function sprite(frames, scale, fps, css) {
  var c = document.createElement('canvas'), f0 = frames[0];
  c.width = f0.width; c.height = f0.height;
  c.className = 'pix';
  c.style.width = f0.width * scale + 'px'; c.style.height = f0.height * scale + 'px';
  if (css) c.style.cssText += ';' + css;
  var a = { el: c, frames: frames, fps: fps, cur: -1, scale: scale, flip: false };
  a.draw = function (t) {
    var i = Math.floor(t * a.fps) % a.frames.length;
    if (i === a.cur) return;
    a.cur = i;
    var f = a.frames[i];
    if (c.width !== f.width || c.height !== f.height) {
      c.width = f.width; c.height = f.height;
      c.style.width = f.width * a.scale + 'px'; c.style.height = f.height * a.scale + 'px';
    }
    var g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); g.drawImage(f, 0, 0);
  };
  a.draw(0);
  anims.push(a);
  return c;
}

// =============================================================
//  MOTOR
// =============================================================
var stage = document.getElementById('stage'), sceneEl = document.getElementById('scene');
var bg = document.getElementById('bg').getContext('2d'), fx = document.getElementById('fx').getContext('2d');
var flashEl = document.getElementById('flash'), wipeEl = document.getElementById('wipe');
var W = 1920, H = 1080;

function fit() {
  var s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();

function el(tag, cls, html, css, parent) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (css) e.style.cssText = css;
  (parent || sceneEl).appendChild(e);
  return e;
}
function A(name, dur, delay, ease, extra) {
  return 'animation:' + name + ' ' + dur + 's ' + (ease || 'cubic-bezier(.2,.9,.3,1.2)') + ' ' + (delay || 0) + 's both' + (extra ? ',' + extra : '') + ';';
}
function flash(dur, color) {
  flashEl.style.background = color || '#fff';
  flashEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: (dur || .5) * 1000, easing: 'ease-out' });
}
function wipe() {
  wipeEl.animate([{ transform: 'translateX(-120%) skewX(-20deg)' }, { transform: 'translateX(0%) skewX(-20deg)', offset: .5 }, { transform: 'translateX(120%) skewX(-20deg)' }],
    { duration: 700, easing: 'cubic-bezier(.7,0,.3,1)' });
}
function shake() {
  sceneEl.classList.remove('shake'); void sceneEl.offsetWidth; sceneEl.classList.add('shake');
}

// ---------- partículas (anillos y chispas) ----------
var parts = [];
function ringBurst(x, y, n, speed) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, v = (speed || 14) * (0.4 + Math.random() * 0.8);
    parts.push({ type: 'ring', x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, g: 0.45, life: 2.6, age: 0, r: 22 + Math.random() * 14, ph: Math.random() * 6 });
  }
}
function sparkBurst(x, y, n, colors) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 22;
    parts.push({ type: 'spark', x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.25, life: 1.2 + Math.random(), age: 0,
      r: 6 + Math.random() * 10, c: colors[i % colors.length] });
  }
}
function ringRain(n) {
  for (var i = 0; i < n; i++)
    parts.push({ type: 'ring', x: Math.random() * W, y: -60 - Math.random() * 900, vx: (Math.random() - .5) * 2, vy: 4 + Math.random() * 4, g: 0.05,
      life: 8, age: 0, r: 18 + Math.random() * 16, ph: Math.random() * 6 });
}
function drawRing(g, x, y, r, t) {
  var sx = Math.abs(Math.cos(t * 5)) * 0.85 + 0.15;
  g.save(); g.translate(x, y); g.scale(sx, 1);
  g.lineWidth = r * 0.42;
  g.strokeStyle = '#8a4b00'; g.beginPath(); g.arc(2, 3, r, 0, 7); g.stroke();
  g.strokeStyle = '#ffc400'; g.beginPath(); g.arc(0, 0, r, 0, 7); g.stroke();
  g.lineWidth = r * 0.14; g.strokeStyle = '#fff6b0'; g.beginPath(); g.arc(-r * .1, -r * .1, r, 3.6, 5.2); g.stroke();
  g.restore();
}
function updateParts(dt, t) {
  fx.clearRect(0, 0, W, H);
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.age += dt; p.vy += p.g * dt * 60; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
    if (p.age > p.life || p.y > H + 100) { parts.splice(i, 1); continue; }
    var fade = Math.min(1, (p.life - p.age) * 2);
    fx.globalAlpha = fade;
    if (p.type === 'ring') drawRing(fx, p.x, p.y, p.r, t + p.ph);
    else { fx.fillStyle = p.c; var s = p.r * (1 - p.age / p.life); fx.fillRect(p.x - s / 2, p.y - s / 2, s, s); }
  }
  fx.globalAlpha = 1;
}

// ---------- fondos ----------
var stars = [];
for (var i = 0; i < 260; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 3 + 0.3 });
var bgMode = 'none', bgOpt = {};
var noiseC = document.createElement('canvas'); noiseC.width = 240; noiseC.height = 135;
var noiseG = noiseC.getContext('2d'), noiseImg = noiseG.createImageData(240, 135);

function drawBg(t) {
  var g = bg, o = bgOpt;
  g.globalAlpha = 1;
  if (bgMode === 'none') { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); return; }
  if (bgMode === 'stars') {
    var grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, o.c1 || '#05021a'); grd.addColorStop(1, o.c2 || '#1a0638');
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], x = ((s.x - t * 60 * s.z * (o.speed || 1)) % W + W) % W;
      var tw = 0.5 + 0.5 * Math.sin(t * 4 + i);
      g.fillStyle = i % 7 === 0 ? '#ffe07a' : i % 5 === 0 ? '#8fe8ff' : '#fff';
      g.globalAlpha = 0.35 + tw * 0.65;
      var sz = Math.ceil(s.z * 2);
      g.fillRect(x | 0, s.y | 0, sz, sz);
    }
    g.globalAlpha = 1;
    return;
  }
  if (bgMode === 'rays') {
    g.fillStyle = o.c1 || '#ff9d00'; g.fillRect(0, 0, W, H);
    g.save(); g.translate(o.x || W / 2, o.y || H / 2); g.rotate(t * (o.speed || 0.25));
    g.fillStyle = o.c2 || '#ffd400';
    var n = 24;
    for (var k = 0; k < n; k++) {
      var a0 = k * Math.PI * 2 / n, a1 = a0 + Math.PI / n;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a0) * 2400, Math.sin(a0) * 2400); g.lineTo(Math.cos(a1) * 2400, Math.sin(a1) * 2400); g.fill();
    }
    g.restore();
    var rg = g.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 1100);
    rg.addColorStop(0, 'rgba(255,255,255,.55)'); rg.addColorStop(.4, 'rgba(255,255,255,0)'); rg.addColorStop(1, 'rgba(0,0,0,.55)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    return;
  }
  if (bgMode === 'grid') {
    // cielo synthwave + sol + suelo en perspectiva
    var hz = 600, sky = g.createLinearGradient(0, 0, 0, hz);

    g.globalAlpha = 1;

    g.fillStyle = sun; g.fillRect(W / 2 - 300, hz - 300, 600, 300);

    for (var b = 0; b < 7; b++) { var yy = hz - 20 - b * 34 + ((t * 30) % 34); g.fillRect(W / 2 - 300, yy, 600, 6 + b * 1.2); }
    g.restore();
    g.fillStyle = '#12002a'; g.fillRect(0, hz, W, H - hz);
    g.strokeStyle = o.line || '#28e0ff'; g.lineWidth = 3; g.shadowColor = o.line || '#28e0ff'; g.shadowBlur = 16;
    for (var vx = -30; vx <= 30; vx++) { g.beginPath(); g.moveTo(W / 2 + vx * 20, hz); g.lineTo(W / 2 + vx * 260, H); g.stroke(); }
    var off = (t * (o.speed || 1.2)) % 1;
    for (var r = 0; r < 18; r++) { var z = (r + 1 - off), y = hz + (H - hz) * (1 / z) * 0.9; if (y > H || y < hz) continue; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

    for (var p = 0; p < d.length; p += 4) { var v = Math.random() * 255 | 0; d[p] = d[p + 1] = d[p + 2] = v; d[p + 3] = 255; }

// Paisaje tipo "Green Hill" (cielo, nubes, montañas y suelo a cuadros) — también usado dentro de paneles
function drawHill(g, x0, y0, w, h, t, sp) {
  g.save(); g.beginPath(); g.rect(x0, y0, w, h); g.clip(); g.translate(x0, y0);
  var sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#2a6cff'); sky.addColorStop(.55, '#7cc8ff'); sky.addColorStop(1, '#d8f4ff');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  var u = h / 60;
  g.fillStyle = '#fff';
  for (var c = 0; c < 7; c++) {
    var cx = ((c * w / 3.2 - t * 20 * sp) % (w * 2.2) + w * 2.2) % (w * 2.2) - w * .3, cy = h * (0.12 + (c % 3) * 0.08);
    g.fillRect(cx, cy, 16 * u, 3 * u); g.fillRect(cx + 3 * u, cy - 2 * u, 9 * u, 2 * u); g.fillRect(cx + 5 * u, cy - 4 * u, 5 * u, 2 * u);
  }
  g.fillStyle = '#2d9a4a';
  var mOff = (t * 40 * sp) % (40 * u);
  for (var m = -1; m < w / (40 * u) + 2; m++) {
    var mx = m * 40 * u - mOff;
    g.beginPath(); g.moveTo(mx, h * .72); g.lineTo(mx + 20 * u, h * .42 + (m % 2) * 6 * u); g.lineTo(mx + 40 * u, h * .72); g.fill();
  }
  g.fillStyle = '#1f7a38'; g.fillRect(0, h * .7, w, h * .05);
  var gy = h * .75, ts = 8 * u, off = (t * 160 * sp) % (ts * 2);
  g.fillStyle = '#5ce04a'; g.fillRect(0, gy, w, 2 * u);
  g.fillStyle = '#3aa832'; g.fillRect(0, gy + 2 * u, w, u);
  for (var ty = 0; ty < 4; ty++) for (var tx = -2; tx < w / ts + 2; tx++) {
    g.fillStyle = (tx + ty) % 2 ? '#b8641c' : '#7a3a0c';
    g.fillRect(tx * ts - off + (ty % 2 ? 0 : 0), gy + 3 * u + ty * ts, ts, ts);
  }
  g.restore();
}

// ---------- secuencia ----------
var SCENES = [], idx = -1, sceneT = 0, events = [], update = null, running = false, paused = false;
function scene(dur, bgm, opt, build, trans) { SCENES.push({ dur: dur, bg: bgm, opt: opt || {}, build: build, trans: trans }); }
function gameplay(texto, sub) {
  scene(GAMEPLAY_SEGUNDOS, 'none', {}, function (ctx) {
    stage.classList.add('clean');
    var box = el('div', 'gp');
    el('div', 'lbl', '<i></i>GAMEPLAY', A('fadeIn', .4, .2, 'ease'), box);
    el('div', 'what outline-s', texto, A('wordIn', .6, .35), box);
    if (sub) el('div', 'xs', sub, 'color:#9aa;' + A('fadeIn', .6, .9, 'ease'), box);
    var bar = el('div', 'bar', '<b></b>', A('fadeIn', .4, .5, 'ease'), box).firstChild;
    ctx.update = function (t) { bar.style.transform = 'scaleX(' + Math.min(1, t / GAMEPLAY_SEGUNDOS) + ')'; };
  }, 'cut');
}

function go(i) {
  if (i < 0) i = 0;
  if (i >= SCENES.length) { finish(); return; }
  idx = i; sceneT = 0; events = []; anims = []; update = null;
  sceneEl.innerHTML = ''; sceneEl.className = ''; sceneEl.style.opacity = 1;
  stage.classList.remove('clean');
  var s = SCENES[i];
  bgMode = s.bg; bgOpt = s.opt;
  var ctx = {
    at: function (sec, fn) { events.push({ t: sec, fn: fn }); },
    update: null
  };
  s.build(ctx);
  update = ctx.update;
  if (s.trans === 'flash') flash(.45);
  else if (s.trans === 'wipe') wipe();
}
function finish() {
  running = false; sceneEl.innerHTML = ''; bgMode = 'none'; parts = [];
  document.body.classList.remove('playing');
}

var last = performance.now(), clock = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running && !paused) {
    sceneT += dt; clock += dt;
    for (var e = 0; e < events.length; e++) if (!events[e].done && sceneT >= events[e].t) { events[e].done = true; events[e].fn(); }
    if (update) update(sceneT);
    for (var a = 0; a < anims.length; a++) anims[a].draw(sceneT);
    if (sceneT >= SCENES[idx].dur) go(idx + 1);
  }
  if (!paused) { drawBg(clock); updateParts(running ? dt : 0, clock); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function begin(from) {
  document.getElementById('start').style.display = 'none';
  document.body.classList.add('playing');
  parts = []; running = true; paused = false; stage.classList.remove('paused'); clock = 0;
  go(from || 0);
}
document.getElementById('start').addEventListener('click', function () { begin(+params.get('scene') || 0); });
addEventListener('keydown', function (e) {
  var startVisible = document.getElementById('start').style.display !== 'none';
  if (e.key === 'Enter' && startVisible) { begin(+params.get('scene') || 0); return; }
  if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  if (startVisible) return;
  if (e.key === ' ') { paused = !paused; stage.classList.toggle('paused', paused); e.preventDefault(); }
  if (e.key === 'ArrowRight') { parts = []; running = true; go(idx + 1); }
  if (e.key === 'ArrowLeft') { parts = []; running = true; go(idx - 1); }
  if (e.key === 'r' || e.key === 'R') begin(0);
});

  var c = el('div', 'center');
  var d = el('div', 'mid outline', '', 'min-height:90px;', c);
  var txt = 'Y UNA COSA MÁS...';
  ctx.update = function (t) { var n = Math.max(0, Math.floor((t - .6) * 10)); d.textContent = txt.slice(0, n) + (Math.floor(t * 3) % 2 && n < txt.length + 8 ? '_' : ''); };
}, 'cut');

// 13 · Sorpresa: ¡Tails!
scene(8.5, 'rays', { c1: '#050505', c2: '#1a1a1a', speed: .6 }, function (ctx) {
  var wrap = el('div', 'abs', null, 'left:50%;top:150px;transform:translateX(-50%);');
  var tl = TG ? sprite(FR.tails.idle, 14, 6, 'filter:brightness(0) drop-shadow(0 0 30px #fff);transition:filter .1s;') : el('div');
  wrap.appendChild(tl);
  var q = el('div', 'abs big outline', '?', 'left:0;right:0;top:520px;text-align:center;font-size:160px;' + A('popIn', .5, .5, null, 'floaty 1s ease-in-out 1s infinite'));
  var title = el('div', 'center', null, 'justify-content:flex-end;padding-bottom:70px;display:none;');
  el('div', 'mid outline', '¡AHORA PUEDES JUGAR COMO', 'font-size:52px;' + A('slideL', .5, .05), title);
  el('div', 'big', 'TAILS!', 'font-size:210px;color:#fff;text-shadow:0 8px 0 #ffae21,0 16px 0 #e06a00,0 24px 0 #000,8px 0 0 #000,-8px 0 0 #000,0 -8px 0 #000,8px 24px 0 #000,-8px 24px 0 #000,8px -8px 0 #000,-8px -8px 0 #000;' + A('zoomOut', .5, .3, 'cubic-bezier(.2,.8,.3,1.2)', 'pulse 1s ease-in-out 1.2s infinite'), title);
  ctx.at(2.6, function () {
    flash(.9); shake();
    bgOpt = { c1: '#ff7a00', c2: '#ffd400', speed: .5 };
    q.remove();
    if (TG) { tl.style.filter = 'drop-shadow(0 0 3px #000) drop-shadow(14px 14px 0 rgba(0,0,0,.45))'; anims[0].frames = FR.tails.fly; anims[0].fps = 10; anims[0].cur = -1; }
    wrap.style.top = '60px';
    title.style.display = 'flex';
    ringBurst(960, 400, 50, 24);
    sparkBurst(960, 400, 60, ['#fff', '#ffae21', '#ffd400']);
  });
  ctx.at(3.4, function () { ringBurst(300, 1000, 20, 18); ringBurst(1620, 1000, 20, 18); });
  ctx.update = function (t) { if (t > 2.6) wrap.style.transform = 'translateX(-50%) translateY(' + (Math.sin(t * 3) * 25) + 'px)'; };
}, 'cut');

gameplay('JUGANDO COMO <span style="color:#ffae21">TAILS</span>', '¡Con vuelo, como en Sonic 3!');

// 14 · Cierre
scene(9, 'grid', { line: '#ff2fb4', speed: 1.6 }, function (ctx) {
  var c = el('div', 'center', null, 'justify-content:flex-start;padding-top:110px;');
  var logo = el('div', 'logo', null, A('zoomOut', .6, .2, 'cubic-bezier(.2,.8,.3,1.15)'), c);
  el('div', 'somari', 'SOMARI', 'font-size:160px;', logo);
  el('div', 'deluxe', '<span>DELUXE</span>', 'font-size:54px;' + A('drop', .7, .7, 'ease-out'), logo);
  el('div', 'shine', null, null, logo);
  var soon = el('div', 'sm outline-s gold', 'PRÓXIMAMENTE', 'margin-top:70px;font-size:48px;letter-spacing:8px;' + A('popIn', .5, 1.6, null, 'blink 1.2s steps(2) 3s infinite'), c);
  var runners = el('div', 'abs', null, 'bottom:70px;left:-400px;display:flex;align-items:flex-end;gap:40px;');
  runners.appendChild(sprite(FR.somari, 8, 12));
  if (TG) runners.appendChild(sprite(FR.tails.run, 5, 12));
  ctx.at(.6, function () { flash(.5); shake(); ringBurst(960, 300, 36, 20); });
  ctx.at(2, function () { ringRain(40); });
  ctx.update = function (t) {
    runners.style.left = (-400 + Math.max(0, t - 1) * 520) + 'px';
    if (t > 7.6) sceneEl.style.opacity = Math.max(0, 1 - (t - 7.6) / 1.2);
  };
}, 'flash');
scene(1.5, 'none', {}, function () {}, 'cut');
</script>
</body>
</html>
